name: cli release

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - darwin-arm64
          - darwin-amd64
          - linux-arm64
          - linux-amd64
          - windows-arm64
          - windows-amd64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: ./scripts/build-cli.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: 4orm-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 4orm-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/4orm-* > dist/4orm_checksums.txt
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            dist/4orm-*.tar.gz \
            dist/4orm-*.zip \
            dist/4orm_checksums.txt
