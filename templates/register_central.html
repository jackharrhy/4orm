{% extends 'base.html' %}
{% block title %}join 4orm{% endblock %}
{% block content %}
  <h1>join 4orm</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/auth/register" class="stack">
    <label>
      invite code
      <input name="invite_code" value="{{ invite or '' }}" required maxlength="200" />
    </label>
    <button type="submit">continue with Jack Auth</button>
  </form>
{% endblock %}
