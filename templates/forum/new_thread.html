{% extends "base.html" %}
{% from "macros/media_snippets.html" import media_snippet_picker %}

{% block title %}4orm · new thread{% endblock %}

{% block content %}
  <h1>new thread</h1>

  <form method="post" action="/forum/new" class="stack">
    <label>
      title
      <input
        type="text"
        name="title"
        required
        maxlength="200"
        placeholder="thread title"
      />
    </label>

    <label>
      format (<a
        href="https://www.phpbb.com/community/help/bbcode"
        target="_blank"
        >BBCode?</a
      >):
      <select
        name="content_format"
        onchange="if(window._mediaFormat)window._mediaFormat['thread-content']=this.value"
      >
        <option value="bbcode" selected>BBCode</option>
        <option value="markdown">Markdown</option>
      </select>
    </label>

    <label>
      content
      <textarea
        name="content"
        id="thread-content"
        rows="10"
        required
        placeholder="write your post..."
      ></textarea>
    </label>

    {{ media_snippet_picker(media_items, 'thread-content', format='bbcode') }}

    <details class="panel">
      <summary><h2>thread styling</h2></summary>
      <div class="stack 4orm-space-sm">
        <label>
          custom CSS
          <textarea
            name="custom_css"
            rows="4"
            placeholder="CSS applied to this thread"
          ></textarea>
        </label>
        <label>
          custom HTML
          <textarea
            name="custom_html"
            rows="4"
            placeholder="HTML injected into this thread"
          ></textarea>
        </label>
      </div>
    </details>

    <div class="4orm-actions 4orm-space-xs">
      <button type="submit">create thread</button>
      <button
        type="button"
        class="btn-sm"
        onclick="previewPost('thread-content')"
      >
        preview
      </button>
    </div>
    <div id="preview-thread-content" class="forum-preview 4orm-hidden"></div>
  </form>
{% endblock %}
