# OAuth2 client registrations.
#
# Clients defined here are synced to the database on every app startup:
#   - New clients are created
#   - Existing clients are updated to match this file
#   - Declarative clients absent from this file are disabled and revoked
#   - Dynamically registered clients are preserved
#
# The [clients.<key>] becomes the client_id.
# Public clients may also declare allowed_resources as an array of exact RFC
# 8707 resource identifiers. Dynamically registered Artbin MCP clients receive
# their fixed resource policy through /oauth/register instead.

[clients.artbin]
client_name = "artbin"
redirect_uris = [
    "https://artbin.jackharrhy.dev/auth/4orm/callback",
    "https://artbin.jackharrhy.dev/auth/cli/callback",
    "http://localhost:5173/auth/4orm/callback",
    "http://localhost:5173/auth/cli/callback",
]
scope = "openid profile"

[clients.burger]
client_name = "burger"
redirect_uris = [
    "https://big.burger.beauty/auth/4orm/callback",
    "http://localhost:5173/auth/4orm/callback",
]
scope = "openid profile"

[clients.worldview]
client_name = "Worldview"
redirect_uris = [
    "https://worldview.harrhy.xyz/auth/callback",
    "http://localhost:8789/auth/callback",
]
scope = "openid profile"
grant_types = "authorization_code"
token_endpoint_auth_method = "none"

[clients.worldview-service]
client_name = "Worldview service"
redirect_uris = []
scope = "artbin:assets:read artbin:assets:content"
grant_types = "client_credentials"
response_types = ""
token_endpoint_auth_method = "client_secret_basic"
client_kind = "service"
subject = "worldview-service"
access_token_lifetime = 600

[clients.artbin-server]
client_name = "Artbin server"
redirect_uris = []
scope = ""
grant_types = ""
response_types = ""
token_endpoint_auth_method = "client_secret_basic"
client_kind = "resource_server"
access_token_lifetime = 600

[clients.cli]
client_name = "4orm CLI"
redirect_uris = [
	"http://localhost:4444/auth/cli/callback",
]
scope = "openid profile"
grant_types = "authorization_code refresh_token"
