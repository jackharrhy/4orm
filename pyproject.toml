[project]
name = "4orm"
version = "0.1.0"
description = "4orm software"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
  "fastapi==0.162.4",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.8",
  "jinja2==3.1.6",
  "python-multipart==0.0.33",
  "itsdangerous==2.2.0",
  "alembic==1.20.1",
  "markdown==3.11.3",
  "bbcode==1.1.0",
  "bleach==6.4.0",
  "pywebpush==2.5.0",
  "loguru==0.7.3",
  "joserfc==1.8.0",
]

[dependency-groups]
dev = [
  "playwright==1.65.0",
  "ruff==0.17.4",
  "pytest==9.2.0",
  "httpx2==2.16.0",
]

[tool.uv]
package = false
required-version = ">=0.12.0"


[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
target-version = "py315"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"] # FastAPI uses File(...), Form(...) etc. in defaults
